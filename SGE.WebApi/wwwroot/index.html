<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE - Sistema de Gestión de Expedientes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-title">SGE</h1>
            <ul class="nav-menu">
                <li><a href="#" id="navExpedientes">Expedientes</a></li>
                <li><a href="#" id="navTramites">Trámites</a></li>
                <li><a href="#" id="navUsuarios">Usuarios</a></li>
                <li><a href="#" id="btnLogout" class="logout-btn">Cerrar Sesión</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <!-- Sección de Expedientes -->
        <section id="expedientesSection" class="section hidden">
            <h2>Gestión de Expedientes</h2>
            <div class="section-controls">
                <button id="btnNuevoExpediente" class="btn-primary">Nuevo Expediente</button>
            </div>
            <div id="expedientesContent"></div>
        </section>

        <!-- Sección de Trámites -->
        <section id="tramitesSection" class="section hidden">
            <h2>Gestión de Trámites</h2>
            <div class="section-controls">
                <button id="btnNuevoTramite" class="btn-primary">Nuevo Trámite</button>
            </div>
            <div id="tramitesContent"></div>
        </section>

        <!-- Sección de Usuarios -->
        <section id="usuariosSection" class="section hidden">
            <h2>Gestión de Usuarios</h2>
            <div class="section-controls">
                <button id="btnNuevoUsuario" class="btn-primary">Nuevo Usuario</button>
            </div>
            <div id="usuariosContent"></div>
        </section>

        <!-- Sección de Inicio (Dashboard) -->
        <section id="dashboardSection" class="section">
            <h2>Dashboard</h2>
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Expedientes</h3>
                </div>
                <div class="dashboard-card">
                    <h3>Trámites</h3>
                </div>
                <div class="dashboard-card">
                    <h3>Usuarios</h3>
                </div>
            </div>
        </section>
    </div>

    <!-- Modal para crear/editar -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
